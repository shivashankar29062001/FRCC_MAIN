services:
  frcc-web:
    image: frcc-website:1.0
    container_name: frcc-web
    restart: unless-stopped
    ports:
      - "8080:80"
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-alpine AS build
        WORKDIR /app
        COPY . .
        RUN rm -rf node_modules dist && npm ci && npm run build

        FROM nginx:alpine
        RUN printf 'server {\n  listen 80;\n  root /usr/share/nginx/html;\n  index index.html;\n  error_page 404 =200 /index.html;\n}\n' > /etc/nginx/conf.d/default.conf
        COPY --from=build /app/dist /usr/share/nginx/html
        EXPOSE 80
